name: 签名构建与草稿发包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 测试、签名与校验
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 配置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装固定 Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: 检查版本标签
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'versionName\s*=\s*"([^"]+)"', pathlib.Path('app/build.gradle.kts').read_text()).group(1)
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('版本标签与 versionName 不一致')
          PY
      - name: 执行单测与静态检查
        run: bash ./gradlew :app:testDebugUnitTest :core:database:testDebugUnitTest :core:vault:testDebugUnitTest :app:lintRelease --console=plain
      - name: 注入密钥并构建正式包
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, subprocess, tempfile
          for name in ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit('缺少发布签名配置：' + name)
          with tempfile.TemporaryDirectory(prefix='aster-signing-', dir=os.environ['RUNNER_TEMP']) as directory:
              key = pathlib.Path(directory) / 'release.p12'
              key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
              key.chmod(0o600)
              environment = os.environ.copy()
              environment.pop('KEYSTORE_BASE64', None)
              environment['KEYSTORE_PATH'] = str(key)
              subprocess.run(['bash', './gradlew', ':app:assembleRelease', ':app:bundleRelease', '--console=plain', '--no-configuration-cache', '--no-daemon'], env=environment, check=True)
          PY
      - name: 校验签名与产物
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > build/release-certificate.txt
          jarsigner -verify "$AAB"
          keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$AAB" > build/bundle-certificate.txt
          python3 - <<'PY'
          import os, pathlib, re
          expected = os.environ.get('EXPECTED_CERT_SHA256', '').lower()
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('缺少有效的预期证书 SHA-256')
          text = pathlib.Path('build/release-certificate.txt').read_text()
          actual = re.search(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})', text)
          if 'Number of signers: 1' not in text or not actual or actual.group(1).lower() != expected:
              raise SystemExit('发布包签名与长期证书不一致')
          bundle = pathlib.Path('build/bundle-certificate.txt').read_text()
          actual_bundle = re.search(r'SHA256:\s*([0-9a-fA-F:]+)', bundle)
          if not actual_bundle or actual_bundle.group(1).replace(':', '').lower() != expected:
              raise SystemExit('AAB 签名与长期证书不一致')
          PY
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$APK"
          mkdir -p build/release-delivery
          cp "$APK" "$AAB" build/release-delivery/
          cp app/build/outputs/mapping/release/mapping.txt build/release-delivery/
          cp build/release-certificate.txt build/release-delivery/
          cd build/release-delivery
          sha256sum app-release.apk app-release.aab release-certificate.txt > SHA256SUMS.txt
          sha256sum mapping.txt > mapping-SHA256.txt
      - name: 保存校验与测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            core/database/build/reports/tests/
            core/vault/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
      - name: 保存正式包与混淆映射
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: build/release-delivery/
          if-no-files-found: error
          retention-days: 30

  draft:
    name: 创建草稿 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 取回已校验产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: release
      - name: 创建草稿并上传分发文件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > existing-release.txt 2>/dev/null; then
            if [ "$(cat existing-release.txt)" != true ]; then
              echo '同名正式 Release 已存在，禁止覆盖'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/app-release.apk release/app-release.aab release/SHA256SUMS.txt release/release-certificate.txt --clobber
