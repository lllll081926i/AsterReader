name: 正式签名构建与草稿发包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 测试、签名与校验
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 配置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装固定 Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: 检查版本标签
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'versionName\s*=\s*"([^"]+)"', pathlib.Path('app/build.gradle.kts').read_text()).group(1)
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('版本标签与 versionName 不一致')
          PY
      - name: 执行单测与静态检查
        run: bash ./gradlew :app:testDebugUnitTest :core:database:testDebugUnitTest :core:vault:testDebugUnitTest :app:lintRelease --console=plain
      - name: 注入密钥并构建正式包
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, subprocess, tempfile
          for name in ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit('缺少发布签名配置：' + name)
          with tempfile.TemporaryDirectory(prefix='aster-signing-', dir=os.environ['RUNNER_TEMP']) as directory:
              key = pathlib.Path(directory) / 'release.p12'
              key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
              key.chmod(0o600)
              environment = os.environ.copy()
              environment.pop('KEYSTORE_BASE64', None)
              environment['KEYSTORE_PATH'] = str(key)
              for tasks in ([':app:assembleRelease', '-Paster.splitApks=true'],):
                  subprocess.run(['bash', './gradlew', *tasks, '--console=plain', '--no-configuration-cache', '--no-daemon'], env=environment, check=True)
          PY
      - name: 校验签名与产物
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          python3 scripts/Verify-Release.py --expected-certificate "$EXPECTED_CERT_SHA256"
      - name: 保存校验与测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            core/database/build/reports/tests/
            core/vault/build/reports/tests/
            build/reports/release-verification.json
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14
      - name: 保存三个正式安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: build/release-delivery/*.apk
          if-no-files-found: error
          retention-days: 30

  draft:
    name: 创建草稿 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出发布说明
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 取回已校验产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: release
      - name: 创建草稿并上传分发文件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > existing-release.txt 2>/dev/null; then
            if [ "$(cat existing-release.txt)" != true ]; then
              echo '同名正式 Release 已存在，禁止覆盖'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Aster Reader ${RELEASE_TAG#v}" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
          fi
          gh release upload "$RELEASE_TAG" release/*.apk --clobber
