<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
    
    @keyframes sensorPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.35;
      }
      50% {
        transform: scale(1.18);
        opacity: 0.85;
      }
    }
    .animate-sensor-pulse {
      animation: sensorPulse 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes subtleDrift {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .animate-drift {
      animation: subtleDrift 3.5s ease-in-out infinite;
    }

<body class="bg-surface text-on-surface min-h-screen flex flex-col justify-between overflow-x-hidden antialiased select-none">
<!-- Android System Status Bar Simulation -->
<header class="w-full pt-2 px-margin flex items-center justify-between text-on-surface-variant font-label-sm text-label-sm z-20">
<span class="font-medium tracking-tight">09:41</span>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">wifi</span>
<span class="material-symbols-outlined text-[18px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[18px]">battery_full</span>
</div>
</header>
<!-- Top Security Isolation Status Bar -->
<div class="w-full px-margin pt-space-sm flex justify-between items-center z-10">

</div>
<!-- Right Shield Status Telemetry -->
<div class="inline-flex items-center gap-1 text-on-surface-variant font-label-sm text-label-sm">

<span class="">KEEPALIVE</span>
</div>
</div>
<!-- Main Canvas: Strict Privacy Vault Atmosphere (No thumbnails, no book text leak) -->
<main class="w-full flex-1 flex flex-col items-center justify-center px-margin py-space-lg text-center relative max-w-md mx-auto">
<!-- Vault Geometric Emblem -->
<div class="relative mb-6">
<div class="w-20 h-20 rounded-full bg-surface-container-low flex items-center justify-center border border-surface-variant shadow-sm animate-drift">
<div class="w-14 h-14 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
</div>
<!-- Miniature status pip -->
<span class="absolute bottom-0 right-0 p-1 bg-surface-container-lowest rounded-full border border-surface-container-high shadow-xs">
<span class="material-symbols-outlined text-primary text-[14px]">verified_user</span>
</span>

  </div>

  </p>

      <div class="absolute inset-0 rounded-full bg-secondary-container animate-sensor-pulse pointer-events-none"></div>
      <div class="absolute inset-2 rounded-full border border-surface-tint/30 pointer-events-none"></div>
      <!-- Android Biometric Fingerprint Sensor Touchpoint -->
      <button aria-label="请轻触指纹传感器" class="relative z-10 w-20 h-20 rounded-full bg-surface-container flex items-center justify-center text-primary border border-outline-variant shadow-sm active:scale-95 active:bg-secondary-container transition-all duration-150 focus:outline-none" onclick="triggerMockAuth()" type="button">
        <span class="material-symbols-outlined text-[44px]">fingerprint</span>
      </button>
    </div>
    <p class="text-body-sm font-body-sm text-on-surface-variant mt-3 font-medium tracking-wide text-center" id="auth-status-text">
      请轻触指纹传感器
    </p>
  </div>

    </button>

      取消
    </button>
  </div>
</div></section>
<!-- Android System Navigation Bar (Gesture pill) -->
<footer class="w-full py-2 bg-surface-container-lowest flex justify-center items-center z-30">
<div class="w-32 h-1 bg-on-surface/30 rounded-full"></div>
</footer>
<!-- Micro-interaction feedback script -->
<script>
    function triggerMockAuth() {
      const statusText = document.getElementById('auth-status-text');
      statusText.innerText = "正在验证指纹...";
      statusText.classList.remove('text-on-surface-variant');
      statusText.classList.add('text-primary');

      setTimeout(() => {
        statusText.innerText = "验证成功，正在解密书库...";
        statusText.classList.remove('text-primary');
        statusText.classList.add('text-primary-container');
        setTimeout(() => {
          statusText.innerText = "轻触指纹传感器进行验证";
          statusText.classList.remove('text-primary-container');
          statusText.classList.add('text-on-surface-variant');
        }, 1800);
      }, 700);
    }
  </script>
