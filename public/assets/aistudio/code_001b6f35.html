<!-- 4. TOAST NOTIFICATION                      -->
<!-- ========================================== -->
<div class="fixed top-20 left-1/2 -translate-x-1/2 z-50 transition-opacity duration-300 transform opacity-0 pointer-events-none" id="mode-toast">
<div class="bg-surface-container-highest/95 backdrop-blur-md border border-outline-variant/40 text-on-surface px-4 py-2 rounded-full shadow-lg flex items-center gap-2 text-label-md">
<span class="material-symbols-outlined text-[18px] text-primary" id="toast-icon">swap_vert</span>
<span id="toast-text" class="">已切换至 上下滚动 模式</span>
</div>
</div>
<!-- Micro-interaction logic for Reader Chrome, scroll tracking & direction mode toggling -->
<script>
    let chromeVisible = true;
    let autoHideTimer = null;

    // Reading modes: 'vertical' (默认上下连续滚动) -> 'rtl' (从右至左翻页) -> 'ltr' (从左至右翻页)
    const MODES = [
      { key: 'vertical', label: '上下滚动', icon: 'swap_vert', layoutLabel: '条漫', layoutIcon: 'view_agenda' },
      { key: 'rtl', label: 'RTL', icon: 'swap_horiz', layoutLabel: '日漫双页', layoutIcon: 'auto_stories' },
      { key: 'ltr', label: 'LTR', icon: 'east', layoutLabel: '单页', layoutIcon: 'filter_none' }
    ];
    let currentModeIndex = 0; // 0 = 垂直上下连续滚动 (默认)

    function resetAutoHide() {
      clearTimeout(autoHideTimer);
      if (chromeVisible) {
        autoHideTimer = setTimeout(() => {
          hideChrome();
        }, 5500); // 浸润模式自隐
      }
    }

    function handleCanvasTap(e) {
      // Toggle top & bottom chrome when canvas is tapped
      toggleChrome();
    }

    function toggleChrome() {
      if (chromeVisible) {
        hideChrome();
      } else {
        showChrome();
      }
    }

    function hideChrome() {
      chromeVisible = false;
      const top = document.getElementById('top-chrome');
      const bottom = document.getElementById('bottom-chrome');
      
      top.classList.add('-translate-y-full', 'opacity-0');
      bottom.classList.add('translate-y-full', 'opacity-0');
    }

    function showChrome() {
      chromeVisible = true;
      const top = document.getElementById('top-chrome');
      const bottom = document.getElementById('bottom-chrome');
      
      top.classList.remove('-translate-y-full', 'opacity-0');
      bottom.classList.remove('translate-y-full', 'opacity-0');
      resetAutoHide();
    }

    // 交互模式循环切换：上下滚动 -> RTL -> LTR -> 上下滚动
    function cycleReadingMode() {
      currentModeIndex = (currentModeIndex + 1) % MODES.length;
      applyReadingMode(MODES[currentModeIndex]);
      resetAutoHide();
    }

    function applyReadingMode(mode) {
      // 1. 更新底部控制岛方向按钮
      const dirLabel = document.getElementById('direction-label');
      const dirIcon = document.getElementById('direction-icon');
      dirLabel.innerText = mode.label;
      dirIcon.innerText = mode.icon;

      // 2. 更新排版模式按钮提示
      const layoutLabel = document.getElementById('layout-mode-label');
      const layoutIcon = document.getElementById('layout-mode-icon');
      layoutLabel.innerText = mode.layoutLabel;
      layoutIcon.innerText = mode.layoutIcon;

      // 3. 更新顶栏状态徽章
      const badgeText = document.getElementById('badge-reading-text');
      const badgeIcon = document.getElementById('badge-reading-icon');
      badgeText.innerText = mode.label;
      badgeIcon.innerText = mode.icon;

      // 4. 控制主画布视图容器切换
      const scrollFlow = document.getElementById('scroll-flow-container');
      const horizontalFlow = document.getElementById('horizontal-flow-container');

      if (mode.key === 'vertical') {
        scrollFlow.classList.remove('hidden');
        horizontalFlow.classList.add('hidden');
      } else {
        scrollFlow.classList.add('hidden');
        horizontalFlow.classList.remove('hidden');
        if (mode.key === 'rtl') {
          horizontalFlow.classList.add('rtl-scroll-container');
          horizontalFlow.style.direction = 'rtl';
        } else {
          horizontalFlow.classList.remove('rtl-scroll-container');
          horizontalFlow.style.direction = 'ltr';
        }
      }

      // 5. 显示轻量浮层反馈
      showModeToast(mode.label, mode.icon);
    }

    function showModeToast(text, iconName) {
      const toast = document.getElementById('mode-toast');
      const toastText = document.getElementById('toast-text');
      const toastIcon = document.getElementById('toast-icon');

      toastText.innerText = `已切换至 ${text} 模式`;
      toastIcon.innerText = iconName;

      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 1800);
    }

    // 垂直滚动监听，更新当前页码指示与进度条
    const scrollContainer = document.getElementById('scroll-flow-container');
    if (scrollContainer) {
      scrollContainer.addEventListener('scroll', () => {
        const scrollTop = scrollContainer.scrollTop;
        const scrollHeight = scrollContainer.scrollHeight - scrollContainer.clientHeight;
        const percent = Math.min(100, Math.max(0, Math.round((scrollTop / (scrollHeight || 1)) * 100)));

        // 更新进度条 UI (在 70% ~ 76% 之间基准微调或者纯根据滚动百分比)
        const mappedPercent = Math.min(96, Math.max(70, Math.round(70 + (percent * 0.26))));
        updateProgressDisplay(mappedPercent);
      }, { passive: true });
    }

    function updateProgressDisplay(pct) {
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-thumb').style.left = pct + '%';
      document.getElementById('percentage-indicator').innerText = pct + '%';
    }

    function handleProgressBarClick(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = Math.max(1, Math.min(100, Math.round((clickX / rect.width) * 100)));
      updateProgressDisplay(pct);
      const pageCalc = Math.round(1 + (pct / 100) * 119);
      document.getElementById('current-page-text').innerText = pageCalc;
      resetAutoHide();
    }

    function prevChapter() {
      showModeToast('正在加载前一章节：第103话', 'skip_previous');
    }

    function nextChapter() {
      showModeToast('正在加载下一章节：第105话', 'skip_next');
    }

    function toggleReadingTheme(btn) {
      const icon = document.getElementById('theme-icon');
      const label = document.getElementById('theme-label');
      const canvas = document.getElementById('reader-canvas');

      if (label.innerText === '深色') {
        label.innerText = '浅色';
        icon.innerText = 'light_mode';
        canvas.classList.remove('bg-paper-dark-gray');
        canvas.classList.add('bg-paper-light');
      } else {
        label.innerText = '深色';
        icon.innerText = 'dark_mode';
        canvas.classList.remove('bg-paper-light');
        canvas.classList.add('bg-paper-dark-gray');
      }
      resetAutoHide();
    }

    // 默认应用上下滚动模式
    applyReadingMode(MODES[0]);
    resetAutoHide();
  </script>


</body></html>
