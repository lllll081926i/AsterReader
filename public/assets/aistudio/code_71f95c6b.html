<!-- Micro-interaction logic for Reader Chrome auto-fade & controls -->
<script>
    let chromeVisible = true;
    let autoHideTimer = null;

    function resetAutoHide() {
      clearTimeout(autoHideTimer);
      if (chromeVisible) {
        autoHideTimer = setTimeout(() => {
          hideChrome();
        }, 5000); // 5s relaxed timeout for reading immersion
      }
    }

    function toggleChrome() {
      if (chromeVisible) {
        hideChrome();
      } else {
        showChrome();
      }
    }

    function hideChrome() {
      chromeVisible = false;
      const top = document.getElementById('top-chrome');
      const bottom = document.getElementById('bottom-chrome');
      
      top.classList.add('-translate-y-full', 'opacity-0');
      bottom.classList.add('translate-y-full', 'opacity-0');
    }

    function showChrome() {
      chromeVisible = true;
      const top = document.getElementById('top-chrome');
      const bottom = document.getElementById('bottom-chrome');
      
      top.classList.remove('-translate-y-full', 'opacity-0');
      bottom.classList.remove('translate-y-full', 'opacity-0');
      resetAutoHide();
    }

    function toggleReadingTheme(btn) {
      const icon = document.getElementById('theme-icon');
      const label = document.getElementById('theme-label');
      const canvas = document.getElementById('reader-canvas');

      if (label.innerText === '深色') {
        label.innerText = '浅色';
        icon.innerText = 'light_mode';
        canvas.classList.remove('bg-paper-dark-gray');
        canvas.classList.add('bg-paper-light');
      } else {
        label.innerText = '深色';
        icon.innerText = 'dark_mode';
        canvas.classList.remove('bg-paper-light');
        canvas.classList.add('bg-paper-dark-gray');
      }
    }

    // Initialize timer
    resetAutoHide();
  </script>
